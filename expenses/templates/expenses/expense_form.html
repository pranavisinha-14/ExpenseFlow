<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} - ExpenseFlow</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #fff5ef;

            color: #3d3d3d;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #e9967a;

            padding: 18px 6%;

            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {
            font-size: 26px;

            font-weight: bold;
        }


        .navbar-right {
            font-size: 14px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 90%;

            max-width: 850px;

            margin: 55px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            text-align: center;

            margin-bottom: 30px;
        }


        .page-icon {
            font-size: 48px;

            margin-bottom: 10px;
        }


        .page-header h1 {
            margin: 0;

            color: #4b3b35;

            font-size: 38px;
        }


        .page-header p {
            color: #8b7770;

            margin-top: 10px;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 7px 25px rgba(120, 80, 60, 0.12);
        }


        /* =========================
           FORM
        ========================= */

        form p {
            margin-bottom: 22px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #4b3b35;
        }


        input,
        select,
        textarea {
            width: 100%;

            padding: 13px;

            border: 1px solid #e0c8bd;

            border-radius: 8px;

            font-size: 15px;

            font-family: Arial, sans-serif;

            background: #fffaf7;
        }


        input:focus,
        select:focus,
        textarea:focus {
            outline: none;

            border-color: #e9967a;

            box-shadow:
                0 0 0 3px rgba(233, 150, 122, 0.15);
        }


        textarea {
            resize: vertical;

            min-height: 120px;
        }


        .helptext {
            display: block;

            margin-top: 5px;

            color: #999;

            font-size: 12px;
        }


        .errorlist {
            color: #c94c45;

            font-size: 13px;

            padding-left: 20px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }


        .save-btn {
            background: #d9795f;

            color: white;

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-btn:hover {
            background: #c9674e;
        }


        .back-btn {
            background: #f3c09f;

            color: #704b3d;

            text-decoration: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-weight: bold;
        }


        .back-btn:hover {
            background: #eab08d;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 25px;

            margin-top: 50px;

            background: #f6d8cb;

            color: #765c53;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar-right {
                display: none;
            }


            .container {
                width: 92%;

                margin-top: 35px;
            }


            .form-card {
                padding: 25px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .buttons {
                flex-direction: column;
            }


            .save-btn,
            .back-btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            💰 ExpenseFlow
        </div>

        <div class="navbar-right">
            Personal Finance Manager
        </div>

    </div>


    <!-- MAIN -->

    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <div class="page-icon">
                {% if title == "Edit Transaction" %}
                    ✏️
                {% else %}
                    💸
                {% endif %}
            </div>


            <h1>
                {{ title }}
            </h1>


            <p>
                Keep your finances organized and under control.
            </p>

        </div>


        <!-- FORM CARD -->

        <div class="form-card">


            <form method="POST">

                {% csrf_token %}


                {{ form.as_p }}


                <div class="buttons">


                    <button
                        type="submit"
                        class="save-btn"
                    >
                        💾

                        {% if title == "Edit Transaction" %}
                            Update Transaction
                        {% else %}
                            Save Transaction
                        {% endif %}

                    </button>


                    <a
                        href="{% url 'expense_list' %}"
                        class="back-btn"
                    >
                        ← Back to Dashboard
                    </a>


                </div>


            </form>


        </div>


    </div>


    <!-- FOOTER -->

    <footer>

        ExpenseFlow • Built with Django

    </footer>


</body>

</html>
