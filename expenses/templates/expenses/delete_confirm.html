<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Transaction - ExpenseFlow</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #fff5ef;

            color: #3d3d3d;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #e9967a;

            padding: 18px 6%;

            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {
            font-size: 26px;

            font-weight: bold;
        }


        .navbar-right {
            font-size: 14px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 90%;

            max-width: 650px;

            margin: 80px auto;
        }


        /* =========================
           DELETE CARD
        ========================= */

        .delete-card {
            background: white;

            padding: 45px;

            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 7px 25px rgba(120, 80, 60, 0.15);
        }


        /* =========================
           WARNING
        ========================= */

        .warning-icon {
            font-size: 58px;

            margin-bottom: 15px;
        }


        .delete-card h1 {
            color: #4b3b35;

            margin: 0 0 15px;

            font-size: 32px;
        }


        .message {
            color: #8b7770;

            font-size: 16px;

            line-height: 1.6;
        }


        /* =========================
           TRANSACTION
        ========================= */

        .transaction-name {
            background: #fff1ea;

            padding: 16px;

            margin: 25px 0;

            border-radius: 9px;

            color: #c9674e;

            font-weight: bold;

            font-size: 19px;
        }


        .warning {
            color: #c94c45;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;
        }


        .buttons form {
            margin: 0;
        }


        .delete-btn {
            background: #d95f59;

            color: white;

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .delete-btn:hover {
            background: #c94c45;
        }


        .cancel-btn {
            background: #f3c09f;

            color: #704b3d;

            text-decoration: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-weight: bold;
        }


        .cancel-btn:hover {
            background: #eab08d;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 25px;

            margin-top: 50px;

            background: #f6d8cb;

            color: #765c53;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar-right {
                display: none;
            }


            .delete-card {
                padding: 30px 20px;
            }


            .delete-card h1 {
                font-size: 27px;
            }


            .buttons {
                flex-direction: column;
            }


            .buttons form {
                width: 100%;
            }


            .delete-btn,
            .cancel-btn {
                width: 100%;

                display: block;

                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            💰 ExpenseFlow
        </div>

        <div class="navbar-right">
            Personal Finance Manager
        </div>

    </div>


    <!-- MAIN -->

    <div class="container">


        <div class="delete-card">


            <div class="warning-icon">
                ⚠️
            </div>


            <h1>
                Delete Transaction?
            </h1>


            <p class="message">

                Are you sure you want to delete this transaction?

            </p>


            <div class="transaction-name">

                {{ expense.title }}

            </div>


            <p class="warning">

                ⚠️ This action cannot be undone.

            </p>


            <div class="buttons">


                <form method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="delete-btn"
                    >
                        🗑 Delete Transaction
                    </button>

                </form>


                <a
                    href="{% url 'expense_list' %}"
                    class="cancel-btn"
                >
                    ← Cancel
                </a>


            </div>


        </div>


    </div>


    <!-- FOOTER -->

    <footer>

        ExpenseFlow • Built with Django

    </footer>


</body>

</html>
